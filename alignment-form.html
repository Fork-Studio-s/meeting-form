<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabeln Studio — Alignment Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15161B; --ink-soft:#1D1F26; --bone:#EFE9DC;
    --stone:#8E8B82; --stone-dim:#5B5A56; --gold:#D9A441;
    --line: rgba(239,233,220,0.14); --err:#E2613B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--bone);font-family:'Space Grotesk',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 24px 40px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:19px;color:var(--bone);}
  .langtoggle{display:flex;gap:2px;border:1px solid var(--line);border-radius:100px;padding:3px;}
  .langtoggle button{background:transparent;border:none;color:var(--stone);font-family:'Space Grotesk',sans-serif;font-size:12px;padding:6px 12px;border-radius:100px;cursor:pointer;transition:background .2s,color .2s;}
  .langtoggle button.active{background:var(--bone);color:var(--ink);}
  .path{position:relative;height:2px;background:var(--line);margin-bottom:52px;border-radius:2px;}
  .path-fill{position:absolute;top:0;left:0;height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease;}
  .path-marker{position:absolute;top:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);transition:left .4s ease;box-shadow:0 0 0 5px rgba(217,164,65,0.15);}
  .screen{display:none;flex:1;flex-direction:column;justify-content:center;}
  .screen.active{display:flex;animation:rise .35s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .kicker{font-size:13px;color:var(--gold);margin-bottom:14px;font-weight:500;}
  h1{font-family:'Newsreader',serif;font-weight:400;font-size:32px;line-height:1.28;margin:0 0 10px;max-width:34ch;}
  .sub{color:var(--stone);font-size:15px;line-height:1.6;max-width:48ch;margin:0 0 32px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12.5px;color:var(--stone);margin-bottom:8px;}
  .pair{display:flex;gap:20px;}
  .pair .field{flex:1;}
  input[type=text],input[type=email],input[type=tel]{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--bone);font-family:'Space Grotesk',sans-serif;font-size:18px;padding:10px 2px;outline:none;transition:border-color .2s;}
  input:focus{border-color:var(--gold);}
  .options{display:flex;flex-direction:column;gap:0;margin-top:4px;}
  .opt{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:padding-left .2s;}
  .opt:hover{padding-left:8px;}
  .opt .mark{width:16px;height:16px;border:1px solid var(--stone-dim);border-radius:3px;flex:none;position:relative;}
  .opt.selected .mark{border-color:var(--gold);background:var(--gold);}
  .opt.selected .mark::after{content:'';position:absolute;top:2px;left:5px;width:4px;height:8px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg);}
  .opt .opt-label{font-size:16px;}
  .otherwrap{margin-top:14px;display:none;}
  .otherwrap.show{display:block;}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:36px;}
  .btn{font-family:'Space Grotesk',sans-serif;font-size:14px;padding:13px 28px;border-radius:100px;border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer;font-weight:500;transition:opacity .2s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--stone);border:1px solid transparent;padding:13px 6px;}
  .btn.ghost:hover{color:var(--bone);}
  .errmsg{color:var(--err);font-size:12.5px;margin-top:6px;display:none;}
  .errmsg.show{display:block;}
  .final .sub{max-width:44ch;}
  /* Honeypot — visually and semantically hidden, never shown to real users */
  .hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;}
  @media (max-width:520px){
    h1{font-size:26px;} .app{padding:22px 18px 32px;} .pair{flex-direction:column;gap:0;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">Gabeln Studio</div>
    <div class="langtoggle">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-id" onclick="setLang('id')">ID</button>
    </div>
  </div>

  <div class="path"><div class="path-fill" id="pathFill"></div><div class="path-marker" id="pathMarker"></div></div>

  <!-- honeypot: never rendered to real users, bots that autofill everything will trip it -->
  <input type="text" id="company_website_hp" name="company_website_hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

  <!-- STEP 1: name -->
  <div class="screen active" data-step="1">
    <div class="kicker" data-t="k1"></div>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="s1"></p>
    <div class="field">
      <label data-t="l_name"></label>
      <input type="text" id="name" data-t-ph="ph_name">
    </div>
    <div class="errmsg" id="err1" data-t="err_req"></div>
    <div class="nav"><span></span><button class="btn" onclick="next(1)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 2: email + phone -->
  <div class="screen" data-step="2">
    <div class="kicker" data-t="k2"></div>
    <h1 id="h2"></h1>
    <p class="sub" data-t="s2"></p>
    <div class="pair">
      <div class="field"><label data-t="l_email"></label><input type="email" id="email" data-t-ph="ph_email"></div>
      <div class="field"><label data-t="l_phone"></label><input type="tel" id="phone" placeholder="+62 812 3456 7890"></div>
    </div>
    <div class="errmsg" id="err2" data-t="err_req"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(2)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 3: business + handle -->
  <div class="screen" data-step="3">
    <div class="kicker" data-t="k3"></div>
    <h1 data-t="h3"></h1>
    <p class="sub" data-t="s3"></p>
    <div class="field"><label data-t="l_business"></label><input type="text" id="business" data-t-ph="ph_business"></div>
    <div class="field"><label data-t="l_handle"></label><input type="text" id="handle" data-t-ph="ph_handle"></div>
    <div class="errmsg" id="err3" data-t="err_req"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(3)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 4: role -->
  <div class="screen" data-step="4">
    <div class="kicker" data-t="k4"></div>
    <h1 id="h4"></h1>
    <div class="options" id="opts-role"></div>
    <div class="otherwrap" id="other-role"><input type="text" id="other-role-input" data-t-ph="ph_other"></div>
    <div class="errmsg" id="err4" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(4)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 5: service -->
  <div class="screen" data-step="5">
    <div class="kicker" data-t="k5"></div>
    <h1 id="h5"></h1>
    <div class="options" id="opts-service"></div>
    <div class="otherwrap" id="other-service"><input type="text" id="other-service-input" data-t-ph="ph_other"></div>
    <div class="errmsg" id="err5" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(5)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 6: curiosity -->
  <div class="screen" data-step="6">
    <div class="kicker" data-t="k6"></div>
    <h1 id="h6"></h1>
    <div class="options" id="opts-curiosity"></div>
    <div class="otherwrap" id="other-curiosity"><input type="text" id="other-curiosity-input" data-t-ph="ph_other"></div>
    <div class="errmsg" id="err6" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(6)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 7: outcome -->
  <div class="screen" data-step="7">
    <div class="kicker" data-t="k7"></div>
    <h1 id="h7"></h1>
    <div class="options" id="opts-outcome"></div>
    <div class="otherwrap" id="other-outcome"><input type="text" id="other-outcome-input" data-t-ph="ph_other"></div>
    <div class="errmsg" id="err7" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(7)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 8: timeline -->
  <div class="screen" data-step="8">
    <div class="kicker" data-t="k8"></div>
    <h1 id="h8"></h1>
    <div class="options" id="opts-timeline"></div>
    <div class="errmsg" id="err8" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="next(8)" data-t="btn_next"></button></div>
  </div>

  <!-- STEP 9: budget -->
  <div class="screen" data-step="9">
    <div class="kicker" data-t="k9"></div>
    <h1 id="h9"></h1>
    <div class="options" id="opts-budget"></div>
    <div class="errmsg" id="err9" data-t="err_choose"></div>
    <div class="nav"><button class="btn ghost" onclick="back()" data-t="btn_back"></button><button class="btn" onclick="submitForm()" data-t="btn_submit"></button></div>
  </div>

  <!-- THANK YOU -->
  <div class="screen final" data-step="10">
    <div class="kicker" data-t="k10"></div>
    <h1 data-t="h10"></h1>
    <p class="sub" data-t="s10"></p>
  </div>

</div>

<script>
const T = {
  en: {
    k1:"Before we get on a call", h1:"Let's start with a few quick basics.",
    s1:"Just a couple of screens — this helps us make the most of your session.",
    l_name:"Your name", ph_name:"e.g. Sarah",
    k2:"01 — Reaching you", s2:"So we know where to send the meeting details.",
    l_email:"Email address", ph_email:"you@business.com", l_phone:"Phone number",
    k3:"02 — Your business", s3:"Helps us look you up before the call.",
    l_business:"Business name", ph_business:"e.g. Kasa Villa",
    l_handle:"Instagram handle or website", ph_handle:"@yourbrand or yourbrand.com",
    k4:"03 — Your role", role_head:"What's your role at {biz}?",
    k5:"04 — What you're exploring", service_head:"What are you exploring for {biz}?",
    k6:"05 — On your mind", curiosity_head:"When it comes to {svc}, what's on your mind most right now?",
    k7:"06 — Desired outcome", outcome_head:"If you moved forward with {svc}, what outcome would make it worth it?",
    k8:"07 — Timeline", timeline_head:"When would you like to start seeing {out}?",
    k9:"08 — Investment", budget_head:"To get {out} from {svc}, what investment feels reasonable right now?",
    k10:"You're all set.", h10:"Thanks — see you on the call.",
    s10:"We'll review this before your session so the conversation goes straight to what matters.",
    btn_next:"Continue", btn_back:"Back", btn_submit:"Submit",
    err_req:"Please fill in the fields above.", err_choose:"Please choose an option.",
    ph_other:"Tell us more",
    role:["Owner / Founder","Marketing or Brand Manager","Other"],
    service:["Web Design & Development","Branding","IT Solution","Digital Infrastructure","E-Commerce","Other"],
    curiosity:["How we'd approach it","What it typically costs","What results to expect","Other"],
    outcome:["More leads or inquiries","Stronger brand perception","Business scale","Revenue growth","Other"],
    timeline:["< 3 months","3–6 months","6 months – 1 year","> 1 year"],
    budget:["Under IDR 20mio","IDR 20–50mio","IDR 50–100mio","IDR 100mio+"],
    fallback_biz:"your business"
  },
  id: {
    k1:"Sebelum sesi kita", h1:"Mulai dari data dasar dulu ya.",
    s1:"Cuma beberapa layar kok — ini biar sesi kamu nanti lebih maksimal.",
    l_name:"Nama kamu", ph_name:"cth. Sarah",
    k2:"01 — Cara kita hubungi", s2:"Biar kita tahu ke mana kirim detail meeting-nya.",
    l_email:"Alamat email", ph_email:"kamu@bisnis.com", l_phone:"Nomor telepon",
    k3:"02 — Bisnismu", s3:"Biar kita bisa lihat-lihat dulu sebelum sesinya.",
    l_business:"Nama bisnis", ph_business:"cth. Kasa Villa",
    l_handle:"Instagram atau website", ph_handle:"@yourbrand atau yourbrand.com",
    k4:"03 — Peranmu", role_head:"Posisi kamu di {biz} apa?",
    k5:"04 — Yang lagi dicari", service_head:"Untuk {biz}, kamu lagi explore yang mana?",
    k6:"05 — Yang lagi dipikirin", curiosity_head:"Soal {svc}, yang paling kamu pikirin sekarang apa?",
    k7:"06 — Hasil yang diinginkan", outcome_head:"Kalau kamu lanjut dengan {svc}, hasil apa yang bikin ini worth it?",
    k8:"07 — Waktu", timeline_head:"Kamu pengen mulai lihat {out} dari kapan?",
    k9:"08 — Investasi", budget_head:"Untuk dapetin {out} dari {svc}, investasi yang masuk akal buat kamu berapa?",
    k10:"Siap!", h10:"Makasih — sampai ketemu di sesinya.",
    s10:"Kita bakal review ini dulu sebelum sesi, biar obrolannya langsung ke yang penting.",
    btn_next:"Lanjut", btn_back:"Kembali", btn_submit:"Kirim",
    err_req:"Mohon lengkapi kolom di atas.", err_choose:"Mohon pilih salah satu.",
    ph_other:"Ceritain lebih lanjut",
    role:["Owner / Founder","Marketing atau Brand Manager","Lainnya"],
    service:["Web Design & Development","Branding","IT Solution","Digital Infrastructure","E-Commerce","Lainnya"],
    curiosity:["Cara kita approach-nya","Kira-kira biayanya berapa","Hasil yang bisa diharapkan","Lainnya"],
    outcome:["Lebih banyak leads atau inquiry","Brand perception lebih kuat","Scale bisnis","Pertumbuhan revenue","Lainnya"],
    timeline:["< 3 bulan","3–6 bulan","6 bulan – 1 tahun","> 1 tahun"],
    budget:["Di bawah IDR 20jt","IDR 20–50jt","IDR 50–100jt","IDR 100jt+"],
    fallback_biz:"bisnismu"
  }
};

let lang='en';
let currentStep=1;
const totalSteps=9;
const state = { role:null, roleOther:'', service:null, serviceOther:'', curiosity:null, curiosityOther:'',
  outcome:null, outcomeOther:'', timeline:null, budget:null };

function setLang(l){
  lang=l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-id').classList.toggle('active', l==='id');
  renderText();
}

function bizName(){
  const v = document.getElementById('business').value.trim();
  return v || T[lang].fallback_biz;
}
function serviceLabel(){
  if(state.service === 'other') return state.serviceOther || (lang==='en' ? 'that' : 'itu');
  return state.service || (lang==='en' ? 'that' : 'itu');
}
function outcomeLabel(){
  if(state.outcome === 'other') return state.outcomeOther || (lang==='en' ? 'that result' : 'hasil itu');
  return state.outcome || (lang==='en' ? 'that result' : 'hasil itu');
}

function renderText(){
  const t = T[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.getAttribute('data-t');
    if(t[k]!==undefined) el.textContent = t[k];
  });
  document.querySelectorAll('[data-t-ph]').forEach(el=>{
    const k = el.getAttribute('data-t-ph');
    if(t[k]!==undefined) el.placeholder = t[k];
  });
  document.getElementById('h2').textContent = lang==='en' ? "How should we reach you?" : "Cara hubungin kamu gimana?";
  document.getElementById('h4').textContent = t.role_head.replace('{biz}', bizName());
  document.getElementById('h5').textContent = t.service_head.replace('{biz}', bizName());
  document.getElementById('h6').textContent = t.curiosity_head.replace('{svc}', serviceLabel());
  document.getElementById('h7').textContent = t.outcome_head.replace('{svc}', serviceLabel());
  document.getElementById('h8').textContent = t.timeline_head.replace('{out}', outcomeLabel());
  document.getElementById('h9').textContent = t.budget_head.replace('{out}', outcomeLabel()).replace('{svc}', serviceLabel());

  renderOptions('opts-role','role','role');
  renderOptions('opts-service','service','service');
  renderOptions('opts-curiosity','curiosity','curiosity');
  renderOptions('opts-outcome','outcome','outcome');
  renderOptions('opts-timeline','timeline','timeline', false);
  renderOptions('opts-budget','budget','budget', false);
  updateProgress();
}

function renderOptions(containerId, stateKey, listKey, hasOther=true){
  const container = document.getElementById(containerId);
  const list = T[lang][listKey];
  container.innerHTML='';
  list.forEach((label, idx)=>{
    const isOther = hasOther && idx === list.length-1;
    const div = document.createElement('div');
    div.className='opt';
    div.innerHTML = `<div class="mark"></div><div class="opt-label">${label}</div>`;
    const val = isOther ? 'other' : label;
    if(state[stateKey] === val) div.classList.add('selected');
    div.onclick = (e) => selectOption(stateKey, val, containerId, isOther, e);
    container.appendChild(div);
  });
  const otherWrap = document.getElementById('other-'+stateKey);
  if(otherWrap) otherWrap.classList.toggle('show', state[stateKey]==='other');
}

function selectOption(stateKey, val, containerId, isOther, e){
  state[stateKey] = val;
  document.querySelectorAll('#'+containerId+' .opt').forEach(o=>o.classList.remove('selected'));
  e.currentTarget.classList.add('selected');
  const otherWrap = document.getElementById('other-'+stateKey);
  if(otherWrap) otherWrap.classList.toggle('show', isOther);
  if(isOther) document.getElementById('other-'+stateKey+'-input').focus();
  if(stateKey==='service'){
    document.getElementById('h6').textContent = T[lang].curiosity_head.replace('{svc}', serviceLabel());
    document.getElementById('h7').textContent = T[lang].outcome_head.replace('{svc}', serviceLabel());
  }
  if(stateKey==='outcome'){
    document.getElementById('h8').textContent = T[lang].timeline_head.replace('{out}', outcomeLabel());
  }
}

function updateProgress(){
  const pct = ((currentStep-1)/(totalSteps-1))*100;
  document.getElementById('pathFill').style.width = pct+'%';
  document.getElementById('pathMarker').style.left = pct+'%';
}

function showStep(n){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.toggle('active', parseInt(s.getAttribute('data-step'))===n);
  });
  currentStep = n;
  updateProgress();
  window.scrollTo(0,0);
}
function showError(id, show){ document.getElementById(id).classList.toggle('show', show); }

function next(step){
  showError('err'+step, false);
  if(step===1){
    if(!document.getElementById('name').value.trim()){ showError('err1', true); return; }
  }
  if(step===2){
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    if(!email || !phone){ showError('err2', true); return; }
  }
  if(step===3){
    const biz = document.getElementById('business').value.trim();
    const handle = document.getElementById('handle').value.trim();
    if(!biz || !handle){ showError('err3', true); return; }
    renderText(); // refresh interpolations now that business name exists
  }
  if(step===4){
    if(!state.role){ showError('err4', true); return; }
    if(state.role==='other'){
      state.roleOther = document.getElementById('other-role-input').value.trim();
      if(!state.roleOther){ showError('err4', true); return; }
    }
  }
  if(step===5){
    if(!state.service){ showError('err5', true); return; }
    if(state.service==='other'){
      state.serviceOther = document.getElementById('other-service-input').value.trim();
      if(!state.serviceOther){ showError('err5', true); return; }
    }
  }
  if(step===6){
    if(!state.curiosity){ showError('err6', true); return; }
    if(state.curiosity==='other'){
      state.curiosityOther = document.getElementById('other-curiosity-input').value.trim();
      if(!state.curiosityOther){ showError('err6', true); return; }
    }
  }
  if(step===7){
    if(!state.outcome){ showError('err7', true); return; }
    if(state.outcome==='other'){
      state.outcomeOther = document.getElementById('other-outcome-input').value.trim();
      if(!state.outcomeOther){ showError('err7', true); return; }
    }
  }
  if(step===8){
    if(!state.timeline){ showError('err8', true); return; }
  }
  showStep(step+1);
}
function back(){ showStep(currentStep-1); }

function submitForm(){
  if(!state.budget){ showError('err9', true); return; }
  showError('err9', false);

  // Honeypot check — if filled, a bot did it. Real backend should drop this
  // silently with an HTTP 200, per FORM_FIELDS.md.
  const hpValue = document.getElementById('company_website_hp').value;

  const payload = {
    lang,
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    business: document.getElementById('business').value.trim(),
    handle: document.getElementById('handle').value.trim(),
    role: state.role === 'other' ? state.roleOther : state.role,
    service: state.service === 'other' ? state.serviceOther : state.service,
    curiosity: state.curiosity === 'other' ? state.curiosityOther : state.curiosity,
    outcome: state.outcome === 'other' ? state.outcomeOther : state.outcome,
    timeline: state.timeline,
    budget: state.budget,
    company_website_hp: hpValue,
    submittedAt: new Date().toISOString()
  };

  // NOTE: composite GREEN/YELLOW/RED scoring is intentionally NOT calculated
  // here. Per FORM_FIELDS.md, scoring must be computed server-side (Cloud
  // Function) and must never be exposed in client-side code — anyone could
  // read it via devtools if it lived here.
  //
  // Replace this with your actual Cloud Function / Firestore write endpoint:
  // fetch('https://your-region-yourproject.cloudfunctions.net/submitLead', {
  //   method: 'POST',
  //   headers: {'Content-Type':'application/json'},
  //   body: JSON.stringify(payload)
  // });
  console.log('Gabeln Studio alignment form submission:', payload);

  showStep(10);
}

renderText();
</script>
</body>
</html>
